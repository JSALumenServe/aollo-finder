<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apollo Contact Finder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; min-height: 100vh; }

    header {
      background: linear-gradient(135deg, #1a73e8, #0d47a1);
      color: white;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header h1 { font-size: 1.5rem; font-weight: 600; }
    header p { font-size: 0.85rem; opacity: 0.8; margin-top: 2px; }
    .credits-bar {
      margin-left: auto; background: rgba(255,255,255,.15); border-radius: 8px;
      padding: 8px 16px; font-size: 0.82rem; text-align: right; min-width: 160px;
    }
    .credits-bar strong { display: block; font-size: 1.1rem; }
    .credits-low { background: rgba(220,50,50,.5) !important; }

    .logo { font-size: 2rem; }

    main { max-width: 860px; margin: 36px auto; padding: 0 16px 60px; }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      padding: 32px;
      margin-bottom: 28px;
    }
    .card h2 { font-size: 1.1rem; color: #1a73e8; margin-bottom: 20px; font-weight: 600; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .full { grid-column: 1 / -1; }

    label { display: block; font-size: 0.82rem; font-weight: 600; color: #555; margin-bottom: 5px; }
    input {
      width: 100%; padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 8px;
      font-size: 0.93rem; transition: border-color .2s;
    }
    input:focus { outline: none; border-color: #1a73e8; }

    .btn-search {
      width: 100%; padding: 13px; background: #1a73e8; color: white;
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 600;
      cursor: pointer; margin-top: 20px; transition: background .2s;
    }
    .btn-search:hover { background: #1558c0; }
    .btn-search:disabled { background: #aaa; cursor: not-allowed; }

    /* Results */
    #results { display: none; }
    .result-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .badge {
      background: #e8f5e9; color: #2e7d32; font-weight: 600;
      padding: 4px 12px; border-radius: 20px; font-size: 0.82rem;
    }

    .contact-card {
      border: 1.5px solid #e8eaf0; border-radius: 10px;
      padding: 18px 20px; margin-bottom: 12px;
      transition: box-shadow .15s; background: white;
    }
    .contact-card:hover { box-shadow: 0 3px 14px rgba(0,0,0,.1); }

    .contact-name { font-size: 1.05rem; font-weight: 700; color: #1a1a2e; margin-bottom: 12px; }

    .contact-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; }
    .contact-field { font-size: 0.87rem; color: #555; }
    .contact-field span { color: #222; font-weight: 500; }
    .contact-field a { color: #1a73e8; text-decoration: none; }
    .contact-field a:hover { text-decoration: underline; }

    /* Availability badges */
    .avail-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .avail-badge {
      font-size: 0.8rem; padding: 3px 10px; border-radius: 20px; font-weight: 600;
    }
    .avail-yes  { background: #e8f5e9; color: #2e7d32; }
    .avail-no   { background: #f5f5f5; color: #aaa; }
    .revealed-value { color: #1a73e8; font-weight: 600; }

    /* Checkbox select */
    .card-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: #1a73e8; }
    .contact-card.selected { border-color: #1a73e8; background: #f0f6ff; }

    /* Sticky reveal bar */
    .reveal-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #1a1a2e; color: white; padding: 14px 32px;
      display: none; align-items: center; gap: 16px;
      box-shadow: 0 -4px 20px rgba(0,0,0,.2); z-index: 100;
    }
    .reveal-bar.active { display: flex; }
    .btn-reveal-bar {
      padding: 9px 20px; border-radius: 8px; border: none; font-size: 0.9rem;
      font-weight: 600; cursor: pointer; transition: background .2s;
    }
    .btn-reveal-email { background: #1a73e8; color: white; }
    .btn-reveal-email:hover { background: #1558c0; }
    .btn-reveal-phone { background: #e65100; color: white; }
    .btn-reveal-phone:hover { background: #bf360c; }
    .btn-reveal-bar:disabled { background: #555; cursor: not-allowed; }

    .spinner-sm {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid currentColor; border-top-color: transparent;
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .alert {
      padding: 14px 18px; border-radius: 8px; margin-bottom: 16px; font-size: 0.92rem;
    }
    .alert-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .alert-error { background: #fce4ec; color: #c62828; border: 1px solid #ef9a9a; }
    .alert-info { background: #e3f2fd; color: #1565c0; border: 1px solid #90caf9; }

    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 3px solid rgba(255,255,255,.4); border-top-color: white;
      border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle;
      margin-right: 8px;
    }

    .no-results { text-align: center; color: #888; padding: 32px; font-size: 0.95rem; }
    .tip { font-size: 0.8rem; color: #888; margin-top: 6px; line-height: 1.4; }
  </style>
</head>
<body>

<header>
  <div class="logo">🔭</div>
  <div>
    <h1>Apollo Contact Finder</h1>
    <p>Powered by Apollo.io · LumenServe Sales Team</p>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
    <a href="/bulk" style="color:white;opacity:.85;font-size:.85rem;text-decoration:none">📋 Bulk Search</a>
    <a href="/stats" style="color:white;opacity:.85;font-size:.85rem;text-decoration:none">📊 Stats</a>
    <div class="credits-bar" id="credits-bar">
      <strong id="credits-remaining">…</strong>
      credits left
    </div>
  </div>
</header>

<main>
  <div class="card">
    <h2>Search for Contacts</h2>
    <div class="grid">

      <div>
        <label for="name">Person Name</label>
        <input type="text" id="name" placeholder="e.g. Jane Smith">
      </div>

      <div>
        <label for="company">Company</label>
        <input type="text" id="company" placeholder="e.g. Acme Corp">
      </div>

      <div>
        <label for="title">Job Title(s)</label>
        <input type="text" id="title" placeholder="e.g. VP Sales, Director of IT">
        <div class="tip">Separate multiple titles with commas</div>
      </div>

      <div>
        <label for="location">Location</label>
        <input type="text" id="location" placeholder="e.g. New York, Texas">
      </div>

      <div class="full">
        <label for="industry">Industry / Keyword</label>
        <input type="text" id="industry" placeholder="e.g. SaaS, healthcare, logistics">
      </div>

    </div>

    <button class="btn-search" id="search-btn" onclick="doSearch()">Search Apollo</button>
  </div>

  <!-- Results section -->
  <div id="results">
    <div class="result-header">
      <h2 style="color:#333;font-size:1.1rem">Results</h2>
      <div style="display:flex;align-items:center;gap:12px">
        <label style="font-size:.85rem;color:#555;cursor:pointer">
          <input type="checkbox" id="select-all" onchange="toggleAll(this.checked)"> Select all
        </label>
        <span class="badge" id="count-badge">0 found</span>
      </div>
    </div>
    <div id="alerts"></div>
    <div id="results-body"></div>
  </div>
</main>

<!-- Sticky reveal bar -->
<div class="reveal-bar" id="reveal-bar">
  <span id="selected-count" style="font-size:.9rem;opacity:.8">0 selected</span>
  <button class="btn-reveal-bar btn-reveal-email" id="btn-reveal-email" onclick="revealSelected('email')" disabled>
    Reveal Email (uses credits)
  </button>
  <button class="btn-reveal-bar btn-reveal-phone" id="btn-reveal-phone" onclick="revealSelected('phone')" disabled>
    Reveal Phone (uses credits)
  </button>
  <span style="margin-left:auto;font-size:.8rem;opacity:.6">Check contacts above to reveal</span>
</div>

<script>
  async function loadCredits() {
    try {
      const r = await fetch('/credits');
      const d = await r.json();
      if (d.remaining != null) updateCredits(d);
    } catch(e) {}
  }

  function updateCredits(credits) {
    if (!credits || credits.remaining == null) return;
    const rem = credits.remaining;
    document.getElementById('credits-bar').classList.toggle('credits-low', rem <= 10);
    document.getElementById('credits-remaining').textContent = rem;
    if (rem <= 10) {
      document.getElementById('alerts').innerHTML =
        `<div class="alert alert-info">⚠️ Only ${rem} credit(s) remaining — use reveals carefully.</div>`;
    }
  }

  loadCredits();

  // ── Selection state ──────────────────────────────────────────────
  function updateRevealBar() {
    const checked = [...document.querySelectorAll('.contact-check:checked')];
    const count   = checked.length;
    document.getElementById('selected-count').textContent = `${count} selected`;
    document.getElementById('reveal-bar').classList.toggle('active', count > 0);
    document.getElementById('btn-reveal-email').disabled = count === 0;
    document.getElementById('btn-reveal-phone').disabled = count === 0;
    if (count > 0) {
      document.getElementById('btn-reveal-email').textContent = `Reveal ${count} Email${count > 1 ? 's' : ''} (uses credits)`;
      document.getElementById('btn-reveal-phone').textContent = `Reveal ${count} Phone${count > 1 ? 's' : ''} (uses credits)`;
    }
  }

  function toggleAll(checked) {
    document.querySelectorAll('.contact-check').forEach(cb => {
      cb.checked = checked;
      document.getElementById(`card-${cb.dataset.id}`)?.classList.toggle('selected', checked);
    });
    updateRevealBar();
  }

  // ── Search ───────────────────────────────────────────────────────
  async function doSearch() {
    const btn = document.getElementById('search-btn');
    const resultsDiv = document.getElementById('results');
    const body = document.getElementById('results-body');
    const alerts = document.getElementById('alerts');
    document.getElementById('reveal-bar').classList.remove('active');
    document.getElementById('select-all').checked = false;

    const payload = {
      name:     document.getElementById('name').value.trim(),
      company:  document.getElementById('company').value.trim(),
      title:    document.getElementById('title').value.trim(),
      location: document.getElementById('location').value.trim(),
      industry: document.getElementById('industry').value.trim(),
    };

    if (!Object.values(payload).some(v => v)) {
      alerts.innerHTML = '<div class="alert alert-error">Please fill in at least one search field.</div>';
      resultsDiv.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Searching Apollo...';
    resultsDiv.style.display = 'none';
    body.innerHTML = '';
    alerts.innerHTML = '';

    try {
      const resp = await fetch('/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      const data = await resp.json();
      resultsDiv.style.display = 'block';

      if (!resp.ok || data.error) {
        alerts.innerHTML = `<div class="alert alert-error">${data.error || 'An error occurred.'}</div>`;
        document.getElementById('count-badge').textContent = 'Error';
        return;
      }

      document.getElementById('count-badge').textContent = `${data.count} found`;

      if (data.count === 0) {
        body.innerHTML = '<div class="no-results">No contacts found — try broadening your search criteria.</div>';
        return;
      }

      data.contacts.forEach(c => {
        const linkedinHtml = c.linkedin
          ? `<a href="${c.linkedin}" target="_blank">View →</a>` : '—';

        const emailBadge = c.email_revealed
          ? `<span class="avail-badge avail-yes">✓ ${c.email}</span>`
          : c.has_email
            ? `<span class="avail-badge avail-yes" id="email-badge-${c.id}">✓ Email on file</span>`
            : `<span class="avail-badge avail-no">— No email</span>`;

        const phoneBadge = c.phone_revealed
          ? `<span class="avail-badge avail-yes">✓ ${c.phone}</span>`
          : c.has_phone
            ? `<span class="avail-badge avail-yes" id="phone-badge-${c.id}">✓ Phone on file</span>`
            : `<span class="avail-badge avail-no">— No phone</span>`;

        body.innerHTML += `
          <div class="contact-card" id="card-${c.id}" onclick="toggleCard('${c.id}')" style="cursor:pointer">
            <div style="display:flex;align-items:flex-start;gap:12px">
              <input type="checkbox" class="contact-check" data-id="${c.id}"
                ${c.email_revealed && c.phone_revealed ? 'disabled' : ''}
                onclick="event.stopPropagation();toggleCard('${c.id}',this.checked)"
                onchange="updateRevealBar()">
              <div style="flex:1">
                <div class="contact-name">${c.name || '(No name)'}</div>
                <div class="contact-fields">
                  <div class="contact-field">🏷️ <span>${c.title}</span></div>
                  <div class="contact-field">🏢 <span>${c.company}</span></div>
                  <div class="contact-field">📍 <span>${c.location || '—'}</span></div>
                  <div class="contact-field">🔗 <span>${linkedinHtml}</span></div>
                </div>
                <div class="avail-row" id="avail-${c.id}">
                  <span>✉️</span>${emailBadge}
                  <span style="margin-left:8px">📞</span>${phoneBadge}
                </div>
              </div>
            </div>
          </div>`;
      });

    } catch (e) {
      alerts.innerHTML = '<div class="alert alert-error">Network error — please try again.</div>';
      resultsDiv.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Search Apollo';
    }
  }

  function toggleCard(id, forceState) {
    const card = document.getElementById(`card-${id}`);
    const cb   = card.querySelector('.contact-check');
    if (cb.disabled) return;
    cb.checked = forceState !== undefined ? forceState : !cb.checked;
    card.classList.toggle('selected', cb.checked);
    updateRevealBar();
  }

  // ── Reveal selected contacts ─────────────────────────────────────
  async function revealSelected(type) {
    const checked = [...document.querySelectorAll('.contact-check:checked')];
    if (!checked.length) return;

    document.getElementById('btn-reveal-email').disabled = true;
    document.getElementById('btn-reveal-phone').disabled = true;

    const phonePolls = [];

    for (const cb of checked) {
      const personId = cb.dataset.id;
      const card     = document.getElementById(`card-${personId}`);
      const name     = card.querySelector('.contact-name')?.textContent || '';
      const company  = card.querySelector('.contact-field span')?.textContent || '';
      const badge    = document.getElementById(`${type}-badge-${personId}`);

      if (badge) badge.textContent = '⏳ Revealing…';

      try {
        const resp = await fetch('/reveal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: personId, type, contact_name: name, contact_company: company }),
        });
        const data = await resp.json();

        if (data.error) {
          if (badge) { badge.textContent = '✗ Error'; badge.className = 'avail-badge avail-no'; }
          continue;
        }

        if (type === 'phone' && data.queued) {
          phonePolls.push({ personId, badge });
        } else {
          updateCredits(data.credits);
          const value = type === 'email' ? data.email : data.phone;
          if (badge) {
            badge.textContent  = value || '— Not available';
            badge.className    = value ? 'avail-badge avail-yes revealed-value' : 'avail-badge avail-no';
          }
        }
      } catch(e) {
        if (badge) { badge.textContent = '✗ Error'; badge.className = 'avail-badge avail-no'; }
      }

      cb.checked = false;
      card.classList.remove('selected');
    }

    // Poll for queued phone results
    if (phonePolls.length) {
      for (let i = 0; i < 20; i++) {
        await new Promise(r => setTimeout(r, 3000));
        for (const { personId, badge } of phonePolls.filter(p => !p.done)) {
          const poll = await fetch(`/phone-result/${personId}`);
          const pd   = await poll.json();
          if (pd.phone) {
            if (badge) { badge.textContent = pd.phone; badge.className = 'avail-badge avail-yes revealed-value'; }
            phonePolls.find(p => p.personId === personId).done = true;
          }
        }
        if (phonePolls.every(p => p.done)) break;
      }
      phonePolls.filter(p => !p.done).forEach(({ badge }) => {
        if (badge) { badge.textContent = '— Not returned'; badge.className = 'avail-badge avail-no'; }
      });
    }

    updateRevealBar();
    loadCredits();
  }

  // ── misc ─────────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.activeElement.tagName === 'INPUT') doSearch();
  });
</script>

</body>
</html>
